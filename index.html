
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cute Warriors 4.2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#160d29;color:white;font-family:Arial;overflow:hidden;touch-action:none}
#game{height:100dvh;position:relative;background:linear-gradient(#24153e,#10091e)}
#arena{position:absolute;inset:100px 0 130px;overflow:hidden;perspective:600px}
#floor{position:absolute;width:150%;height:125%;left:-25%;top:8%;border-radius:50%;background:radial-gradient(ellipse,#9867ad,#50316e 65%,#211332);border:5px solid #d69aff;transform:rotateX(18deg);box-shadow:0 0 40px #b74dff}
#floor:after{content:"";position:absolute;inset:12%;border:2px solid #e6c1ff;border-radius:50%}
#world{position:absolute;inset:0}
#hud{position:absolute;top:10px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px;z-index:5}
.stat{background:#24143de8;border:1px solid #c68aff;border-radius:12px;padding:8px;font-size:12px}
.bar{width:85px;height:7px;background:#57314f;border-radius:8px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:linear-gradient(90deg,#ff4fc2,#ffb5ed);width:100%}
#message{position:absolute;top:78px;width:100%;text-align:center;color:#ffd9ff;font-weight:bold;font-size:13px;z-index:5}
.character{position:absolute;transform:translate(-50%,-50%);width:110px;height:150px;z-index:2}
.bunny{z-index:3}
.name{text-align:center;font-size:10px;font-weight:bold;text-shadow:0 2px 5px #000;position:absolute;top:0;width:100%}
.body{position:absolute;top:44px;left:37px;width:36px;height:52px;border-radius:16px 16px 12px 12px;background:linear-gradient(120deg,#ffb8eb,#db56bb);border:2px solid #9d3d92;z-index:3}
.chest{position:absolute;top:54px;left:42px;width:27px;height:26px;border-radius:8px;background:linear-gradient(140deg,#d9a3ff,#7841bd);z-index:4;border:2px solid #f2c4ff}
.gem{position:absolute;left:51px;top:60px;width:10px;height:10px;background:#ffe4a2;transform:rotate(45deg);z-index:5}
.head{position:absolute;top:17px;left:29px;width:53px;height:48px;border-radius:48% 48% 45% 45%;background:linear-gradient(140deg,#ffd0ef,#ec79c9);border:2px solid #a94b98;z-index:5}
.ear{position:absolute;top:-15px;width:15px;height:40px;border-radius:80% 80% 35% 35%;background:linear-gradient(#fa9fe0,#b15cce);border:2px solid #a94b98;transform-origin:bottom}
.ear.left{left:7px;transform:rotate(-18deg)}
.ear.right{right:7px;transform:rotate(18deg)}
.eye{position:absolute;top:18px;width:6px;height:9px;border-radius:50%;background:#392044}
.eye.left{left:13px}.eye.right{right:13px}
.nose{position:absolute;left:23px;top:30px;width:7px;height:5px;border-radius:50%;background:#a94691}
.arm{position:absolute;top:53px;width:15px;height:43px;border-radius:12px;background:linear-gradient(90deg,#ffb9e8,#dc66bf);border:2px solid #a94b98;transform-origin:top center;z-index:4}
.arm.left{left:26px;transform:rotate(16deg)}
.arm.right{left:69px;transform:rotate(-16deg)}
.hand{position:absolute;bottom:-8px;left:-3px;width:17px;height:17px;border-radius:50%;background:#e9a0dc;border:2px solid #a94b98}
.fingers{position:absolute;bottom:-9px;left:0;width:17px;height:7px;border-radius:50%;border-bottom:3px solid #a94b98}
.leg{position:absolute;top:89px;width:17px;height:36px;border-radius:9px;background:linear-gradient(90deg,#9864d4,#6331a3);border:2px solid #542b87;transform-origin:top center;z-index:2}
.leg.left{left:37px}.leg.right{left:58px}
.boot{position:absolute;bottom:-5px;left:-4px;width:25px;height:13px;border-radius:8px;background:#ff8cda;border:2px solid #a94b98}
.sword{position:absolute;top:58px;left:87px;width:8px;height:58px;border-radius:5px;background:linear-gradient(90deg,#fff,#d6a9ff,#a34cff);border:1px solid white;transform:rotate(-22deg);transform-origin:bottom;z-index:6;box-shadow:0 0 10px #e58aff}
.sword:after{content:"";position:absolute;bottom:4px;left:-8px;width:23px;height:5px;background:#ffd0f5;border-radius:5px}
.bunny.running .leg.left{animation:legs .23s infinite alternate}
.bunny.running .leg.right{animation:legs .23s infinite alternate-reverse}
.bunny.running .arm.left{animation:arms .23s infinite alternate}
.bunny.running .arm.right{animation:arms .23s infinite alternate-reverse}
.bunny.running .body{animation:bounce .23s infinite alternate}
.bunny.running .head{animation:headMove .35s infinite alternate}
.bunny.running .ear{animation:earMove .3s infinite alternate}
.bunny.attacking .arm.right{animation:swing .22s ease-in-out 2}
.bunny.attacking .sword{animation:sword .22s ease-in-out 2}
@keyframes legs{to{transform:rotate(40deg)}}
@keyframes arms{to{transform:rotate(-38deg)}}
@keyframes bounce{to{transform:translateY(-6px)}}
@keyframes headMove{to{transform:rotate(5deg)}}
@keyframes earMove{to{transform:rotate(25deg)}}
@keyframes swing{to{transform:rotate(-90deg)}}
@keyframes sword{to{transform:rotate(70deg)}}
.enemy .body{background:linear-gradient(#a68bff,#6635a7)}
.enemy .head{background:linear-gradient(#bda3ff,#7551c2)}
.enemy .arm{background:#9a75d8}
.enemy .leg{background:#60449e}
.enemy .ear{display:none}
#bottom{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:7}
#stick{width:105px;height:105px;border:3px solid #dca4ff;border-radius:50%;background:#ffffff25;position:relative;touch-action:none}
#knob{position:absolute;width:42px;height:42px;border-radius:50%;background:#f0b0ff;left:29px;top:29px;box-shadow:0 0 15px #e879f9}
.actions{display:flex;gap:9px}
button{border:2px solid #fff8;color:white;font-weight:bold;background:linear-gradient(145deg,#f27bd6,#713ac0);border-radius:50%;width:67px;height:67px;font-size:12px;box-shadow:0 4px 15px #0007}
button:active{transform:scale(.9)}
#overlay{position:absolute;inset:0;background:#130b25ed;z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}
#card{width:100%;max-width:380px;background:#ffffff12;border:1px solid #d99aff;border-radius:25px;padding:25px}
#card h1{color:#ff9de8;font-size:31px;text-shadow:0 0 15px #e879f9}
#card button{width:auto;height:auto;border-radius:15px;padding:17px 30px;font-size:15px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
<div id="hud">
<div class="stat">❤️ <span id="life">100</span><div class="bar"><div class="fill" id="lifeBar"></div></div></div>
<div class="stat">⭐ <span id="score">0</span></div>
<div class="stat">👾 <span id="remaining">3</span></div>
</div>
<div id="message">PINK SHADOW ARENA</div>
<div id="arena">
<div id="floor"></div>
<div id="world">
<div id="hero" class="character bunny">
<div class="name">FLAME BUNNY</div>
<div class="leg left"><div class="boot"></div></div>
<div class="leg right"><div class="boot"></div></div>
<div class="body"></div><div class="chest"></div><div class="gem"></div>
<div class="arm left"><div class="hand"><div class="fingers"></div></div></div>
<div class="arm right"><div class="hand"><div class="fingers"></div></div></div>
<div class="head"><div class="ear left"></div><div class="ear right"></div><div class="eye left"></div><div class="eye right"></div><div class="nose"></div></div>
<div class="sword"></div>
</div>
</div>
</div>
<div id="bottom">
<div id="stick"><div id="knob"></div></div>
<div class="actions"><button id="attack">⚔️<br>ATAC</button><button id="fire">🔥<br>FIRE</button></div>
</div>
<div id="overlay"><div id="card">
<div style="font-size:65px">🐰</div>
<h1>CUTE WARRIORS</h1>
<h2>4.2 – FULL BODY</h2>
<p>Flame Bunny intră în arenă!</p>
<button id="start">START BATTLE ⚔️</button>
</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const world=$("world"),hero=$("hero");
let x=50,y=68,hp=100,score=0,enemies=[],dx=0,dy=0;
let active=false,raf=0,last=0,attackLock=0;
function createEnemy(i){
let el=document.createElement("div");
el.className="character enemy";
el.innerHTML='<div class="name">SHADOW</div><div class="leg left"></div><div class="leg right"></div><div class="body"></div><div class="chest"></div><div class="arm left"><div class="hand"></div></div><div class="arm right"><div class="hand"></div></div><div class="head"><div class="eye left"></div><div class="eye right"></div></div>';
world.appendChild(el);
return {el,x:22+i*28,y:22,hp:3,hit:0,phase:i};
}
function spawn(){
document.querySelectorAll(".enemy").forEach(e=>e.remove());
enemies=[0,1,2].map(createEnemy);
}
function draw(){
hero.style.left=x+"%";hero.style.top=y+"%";
enemies.forEach(e=>{e.el.style.left=e.x+"%";e.el.style.top=e.y+"%"});
$("life").textContent=hp;
$("lifeBar").style.width=hp+"%";
$("score").textContent=score;
$("remaining").textContent=enemies.length;
hero.classList.toggle("running",Math.abs(dx)+Math.abs(dy)>.1);
}
function attack(power){
if(!active||attackLock>0)return;
attackLock=.35;
hero.classList.remove("attacking");void hero.offsetWidth;hero.classList.add("attacking");
$("message").textContent=power===3?"🔥 PINK FIRE BLAST!":"⚔️ SWORD STRIKE!";
let target=enemies.find(e=>Math.hypot(e.x-x,e.y-y)<(power===3?42:26));
if(target){
target.hp-=power;
target.el.style.filter="brightness(2)";
setTimeout(()=>{if(target.el)target.el.style.filter=""},140);
if(target.hp<=0){
target.el.remove();enemies=enemies.filter(e=>e!==target);
score+=100;
if(!enemies.length)finish(true);
}
}
draw();
}
function finish(win){
active=false;cancelAnimationFrame(raf);
$("overlay").classList.remove("hidden");
$("card").innerHTML='<div style="font-size:65px">'+(win?"🏆":"💜")+'</div><h1>'+(win?"VICTORIE!":"ÎNCEARCĂ DIN NOU")+'</h1><p>Scor: '+score+'</p><button id="start">JOACĂ DIN NOU</button>';
$("start").onclick=start;
}
function loop(t){
if(!active)return;
let dt=Math.min((t-last)/16.67,2)||1;last=t;
x=Math.max(8,Math.min(92,x+dx*.48*dt));
y=Math.max(12,Math.min(88,y+dy*.48*dt));
attackLock=Math.max(0,attackLock-.016*dt);
enemies.forEach(e=>{
let vx=x-e.x,vy=y-e.y,d=Math.hypot(vx,vy)||1;
if(d>12){e.x+=vx/d*.13*dt;e.y+=vy/d*.13*dt}
if(d<12&&t-e.hit>1000){
hp=Math.max(0,hp-6);e.hit=t;
if(hp<=0)finish(false);
}
});
draw();
if(active)raf=requestAnimationFrame(loop);
}
function start(){
$("overlay").classList.add("hidden");
x=50;y=68;hp=100;score=0;attackLock=0;
spawn();draw();active=true;last=performance.now();
cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
$("message").textContent="ÎNVINGE TOȚI ADVERSARII!";
}
$("start").onclick=start;
$("attack").onclick=()=>attack(1);
$("fire").onclick=()=>attack(3);
const stick=$("stick"),knob=$("knob");
let pointer=null;
stick.onpointerdown=e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);move(e)};
stick.onpointermove=e=>{if(pointer===e.pointerId)move(e)};
function move(e){
let r=stick.getBoundingClientRect(),a=e.clientX-r.left-r.width/2,b=e.clientY-r.top-r.height/2,d=Math.max(1,Math.hypot(a,b)),m=Math.min(36,d);
dx=a/d*m/36;dy=b/d*m/36;
knob.style.left=(29+dx*28)+"px";knob.style.top=(29+dy*28)+"px";
}
function release(){pointer=null;dx=dy=0;knob.style.left="29px";knob.style.top="29px"}
stick.onpointerup=release;stick.onpointercancel=release;
spawn();draw();
</script>
</body>
</html>
