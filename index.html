
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cute Warriors 3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100a20;color:white;font-family:Arial;overflow:hidden;touch-action:none}
#game{height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#251442,#100a20)}
header{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;gap:8px}
.stat{background:#25143de8;border:1px solid #bd83ed;border-radius:13px;padding:9px;font-size:13px}
#arena{position:absolute;inset:100px 0 125px;overflow:hidden;perspective:700px}
#floor{position:absolute;width:150%;height:125%;left:-25%;top:5%;border-radius:50%;background:
radial-gradient(ellipse,#67458d 0%,#392353 55%,#211332 75%);
border:5px solid #bd83ed;box-shadow:0 0 45px #c34dff;
transform:rotateX(18deg)}
#floor:after{content:"";position:absolute;inset:10%;border:2px solid #dba4ff;border-radius:50%;opacity:.4}
#world{position:absolute;inset:0}
.character{position:absolute;transform:translate(-50%,-50%);text-align:center;filter:drop-shadow(0 8px 5px #10051d);user-select:none}
.hero{font-size:65px;z-index:3}
.enemy{font-size:48px;z-index:2}
.shadow{height:10px;width:42px;background:#160d29aa;border-radius:50%;margin:auto;margin-top:-8px}
.hpbar{height:6px;width:48px;background:#471b46;border-radius:8px;margin:auto;margin-bottom:3px;overflow:hidden}
.hpbar span{display:block;height:100%;background:#ff70cc}
.name{font-size:10px;font-weight:bold;text-shadow:0 2px 4px black}
#effects{position:absolute;inset:0;pointer-events:none;z-index:4}
.fx{position:absolute;font-size:40px;animation:boom .55s forwards}
@keyframes boom{from{transform:scale(.3);opacity:1}to{transform:scale(2);opacity:0}}
#bottom{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:6}
#stick{width:110px;height:110px;border:3px solid #dca4ff;border-radius:50%;background:#ffffff20;position:relative;touch-action:none}
#knob{position:absolute;width:44px;height:44px;border-radius:50%;background:#ed9fff;left:30px;top:30px;box-shadow:0 0 15px #f09aff}
.actions{display:flex;gap:9px}
button{border:2px solid #f6c5ff;color:white;font-weight:bold;background:linear-gradient(145deg,#ee73cf,#7938bb);border-radius:50%;width:70px;height:70px;font-size:13px;box-shadow:0 4px 15px #8f3cba}
button:active{transform:scale(.9)}
#message{position:absolute;top:76px;left:0;right:0;text-align:center;font-size:13px;color:#ffd8ff;z-index:5}
#overlay{position:absolute;inset:0;background:#130b25ed;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px}
#overlay h1{color:#ff9de8;font-size:35px;text-shadow:0 0 20px #df58ff}
#overlay p{line-height:1.6;color:#ead9ff}
#overlay button{width:auto;height:auto;border-radius:18px;padding:16px 30px;font-size:16px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
<header>
<div class="stat">❤️ <span id="life">100</span></div>
<div class="stat">⭐ <span id="score">0</span></div>
<div class="stat">👾 <span id="remaining">3</span></div>
<div class="stat">⏱ <span id="time">90</span>s</div>
</header>
<div id="message">FLAME BUNNY – PINK SHADOW</div>
<div id="arena">
<div id="floor"></div>
<div id="world">
<div id="hero" class="character hero">
<div class="hpbar"><span id="heroBar"></span></div>
<div class="name">FLAME BUNNY</div>🐰
<div class="shadow"></div>
</div>
</div>
<div id="effects"></div>
</div>
<div id="bottom">
<div id="stick"><div id="knob"></div></div>
<div class="actions">
<button id="hit">⚔️<br>ATAC</button>
<button id="fire">🔥<br>FIRE</button>
</div>
</div>
<div id="overlay">
<h1>🐰 CUTE WARRIORS</h1>
<h2>3.0 – PINK SHADOW</h2>
<p>Flame Bunny are nevoie de tine!<br>Învinge cei trei adversari și câștigă arena.</p>
<button id="start">START BATTLE ⚔️</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const world=$("world"),hero=$("hero");
let x=50,y=70,hp=100,score=0,time=90;
let enemies=[],running=false,dx=0,dy=0,lastDamage=0;
let frame,lastTime=0;
function spawn(){
enemies=[];
world.querySelectorAll(".enemy").forEach(e=>e.remove());
for(let i=0;i<3;i++){
let el=document.createElement("div");
el.className="character enemy";
el.innerHTML='<div class="hpbar"><span></span></div><div class="name">SHADOW</div>'+["👾","🐲","👻"][i]+'<div class="shadow"></div>';
world.appendChild(el);
enemies.push({el,x:20+i*30,y:25,hp:3,max:3,attack:0});
}
}
function draw(){
hero.style.left=x+"%";hero.style.top=y+"%";
enemies.forEach(e=>{
e.el.style.left=e.x+"%";e.el.style.top=e.y+"%";
e.el.querySelector(".hpbar span").style.width=(e.hp/e.max*100)+"%";
});
$("life").textContent=hp;
$("score").textContent=score;
$("remaining").textContent=enemies.length;
$("heroBar").style.width=hp+"%";
}
function effect(px,py,symbol){
let el=document.createElement("div");
el.className="fx";el.textContent=symbol;
el.style.left=px+"%";el.style.top=py+"%";
$("effects").appendChild(el);
setTimeout(()=>el.remove(),600);
}
function attack(power,range,symbol){
if(!running)return;
let target=enemies.filter(e=>Math.hypot(e.x-x,e.y-y)<range)
.sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];
effect(x,y,symbol);
if(!target){$("message").textContent="Apropie-te de adversar!";return}
target.hp-=power;
if(target.hp<=0){
target.el.remove();enemies=enemies.filter(e=>e!==target);
score+=100;
$("message").textContent="VICTORIE ÎN LUPTĂ! +100 ⭐";
if(!enemies.length)finish(true);
}else $("message").textContent="LOVEȘTE! Încă un atac!";
draw();
}
function finish(win){
running=false;cancelAnimationFrame(frame);
$("overlay").classList.remove("hidden");
$("overlay").innerHTML="<h1>"+(win?"🏆 VICTORIE!":"💜 ÎNCEARCĂ DIN NOU")+"</h1><h2>"+(win?"Flame Bunny a cucerit arena!":"Flame Bunny are nevoie de ajutor!")+"</h2><p>Scor final: "+score+"</p><button id='start'>JOACĂ DIN NOU</button>";
$("start").onclick=start;
}
function update(now){
if(!running)return;
let dt=Math.min((now-lastTime)/16.67,2)||1;
lastTime=now;
x=Math.max(7,Math.min(93,x+dx*.65*dt));
y=Math.max(10,Math.min(90,y+dy*.65*dt));
enemies.forEach(e=>{
let vx=x-e.x,vy=y-e.y,d=Math.hypot(vx,vy)||1;
if(d>10){e.x+=vx/d*.16*dt;e.y+=vy/d*.16*dt}
if(d<12&&now-e.attack>1000){
hp=Math.max(0,hp-7);e.attack=now;
if(hp<=0)finish(false);
}
});
draw();
frame=requestAnimationFrame(update);
}
function start(){
$("overlay").classList.add("hidden");
x=50;y=70;hp=100;score=0;time=90;
$("message").textContent="Învinge adversarii!";
spawn();draw();running=true;lastTime=performance.now();
cancelAnimationFrame(frame);frame=requestAnimationFrame(update);
}
$("start").onclick=start;
$("hit").onclick=()=>attack(1,23,"⚔️");
$("fire").onclick=()=>attack(3,35,"🔥");
let stick=$("stick"),knob=$("knob"),active=false;
stick.onpointerdown=e=>{active=true;stick.setPointerCapture(e.pointerId);move(e)};
stick.onpointermove=e=>{if(active)move(e)};
function move(e){
let r=stick.getBoundingClientRect(),aX=e.clientX-r.left-r.width/2,aY=e.clientY-r.top-r.height/2;
let d=Math.max(1,Math.hypot(aX,aY)),scale=Math.min(1,35/d);
dx=aX/d*scale;dy=aY/d*scale;
knob.style.left=(30+dx*28)+"px";knob.style.top=(30+dy*28)+"px";
}
function release(){active=false;dx=dy=0;knob.style.left="30px";knob.style.top="30px"}
stick.onpointerup=release;stick.onpointercancel=release;
setInterval(()=>{
if(running&&time>0){time--;$("time").textContent=time;if(time===0)finish(false)}
},1000);
spawn();draw();
</script>
</body>
</html>
