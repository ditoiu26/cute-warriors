
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CUTE WARRIORS 2 - CINEMATIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#11101d;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
#menu{
 position:fixed;inset:0;z-index:5;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(120deg,#100d20dd,#4a2450aa,#100d20dd);
 text-align:center;padding:20px
}
.card{
 width:min(420px,100%);padding:30px 20px;
 border:1px solid #d7a0ec;border-radius:22px;
 background:#21152deF;box-shadow:0 0 50px #bd6aff44
}
.logo{font-size:clamp(38px,10vw,64px);font-weight:1000;
 color:#ffb5e8;text-shadow:0 0 25px #d45bff}
button{
 border:1px solid #f3c9ff;border-radius:13px;
 padding:15px;color:white;font-weight:bold;
 background:linear-gradient(135deg,#e87bc7,#7339b4);
 cursor:pointer;touch-action:none
}
button:active{transform:scale(.95)}
.buttons{display:grid;gap:12px;margin-top:25px}
#hud{display:none;position:fixed;top:12px;left:12px;right:12px;justify-content:space-between;pointer-events:none}
.panel{background:#191326dd;border:1px solid #d39bed;border-radius:12px;padding:10px;font-size:12px}
#controls{display:none;position:fixed;bottom:18px;left:15px;right:15px;justify-content:space-between;align-items:end;pointer-events:none}
#stick{width:110px;height:110px;border:3px solid #dfa5ff;border-radius:50%;background:#b65cff35;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:42px;height:42px;left:31px;top:31px;border-radius:50%;background:#eea6f4}
.actions{display:flex;gap:8px;pointer-events:auto}
.actions button{width:60px;height:60px;border-radius:50%;padding:3px;font-size:10px}
#msg{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);background:#21152ddd;border:1px solid #d39bed;border-radius:12px;padding:10px;display:none;font-size:12px}
#back{display:none;position:fixed;top:65px;right:12px;padding:10px}
</style>
</head>
<body>

<div id="menu">
 <div class="card">
  <div style="font-size:55px">💎</div>
  <div class="logo">CUTE<br>WARRIORS 2</div>
  <p style="letter-spacing:4px;color:#e6c3f9">CINEMATIC REALISM</p>
  <p>ENTER THE KINGDOM OF LUMINA</p>
  <div class="buttons">
   <button id="play">⚔️ ENTER WORLD</button>
   <button id="multi">🌐 MULTIPLAYER</button>
  </div>
  <p style="font-size:11px;color:#cdb6de">iOS • ANDROID • FANTASY RPG</p>
 </div>
</div>

<div id="hud">
 <div class="panel">❤️ 100<br>⭐ LEVEL 1</div>
 <div class="panel">KINGDOM OF LUMINA</div>
</div>
<div id="msg"></div>
<button id="back">MENU</button>
<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div class="actions">
  <button id="jump">⬆️<br>JUMP</button>
  <button id="attack">⚔️<br>ATTACK</button>
  <button id="magic">🔥<br>MAGIC</button>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

import {GLTFLoader} from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

const $=id=>document.getElementById(id);

// RENDERER
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9990b3);
scene.fog=new THREE.FogExp2(0x9990b3,.009);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xc9c3ff,0x292b35,2));

const sun=new THREE.DirectionalLight(0xffd9c0,3.5);
sun.position.set(-35,55,25);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-60;
sun.shadow.camera.right=60;
sun.shadow.camera.top=60;
sun.shadow.camera.bottom=-60;
scene.add(sun);

const atmosphere=new THREE.PointLight(0xd77bff,55,70);
atmosphere.position.set(0,12,-20);
scene.add(atmosphere);

// MATERIALS
const material=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({
 color,roughness,metalness
});

const groundMat=material(0x465e50);
const stoneMat=material(0x777184);
const darkStone=material(0x393346);
const gold=material(0xd5a64e,.3,.8);
const pink=material(0xd85ebd,.3,.5);
const purple=material(0x633a91,.3,.6);

// GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(250,250,100,100),groundMat
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.3;
ground.receiveShadow=true;
scene.add(ground);

// PROCEDURAL TERRAIN
const terrain=new THREE.Group();
scene.add(terrain);

for(let i=0;i<45;i++){
 const x=(Math.random()-.5)*110;
 const z=-20-Math.random()*100;
 const rock=new THREE.Mesh(
  new THREE.DodecahedronGeometry(2+Math.random()*5,1),
  stoneMat
 );
 rock.position.set(x,Math.random()*2,z);
 rock.scale.y=.7+Math.random();
 rock.castShadow=true;
 terrain.add(rock);
}

// MOUNTAINS
for(let i=0;i<18;i++){
 const a=i*Math.PI*2/18;
 const r=95;
 const mountain=new THREE.Mesh(
  new THREE.ConeGeometry(13+Math.random()*8,30+Math.random()*25,7),
  material(0x655e78)
 );
 mountain.position.set(Math.cos(a)*r,12,Math.sin(a)*r-25);
 mountain.rotation.y=a;
 scene.add(mountain);
}

// CASTLE
const castle=new THREE.Group();
scene.add(castle);

const main=new THREE.Mesh(
 new THREE.BoxGeometry(22,15,14),stoneMat
);
main.position.set(0,7.5,-78);
main.castShadow=true;
castle.add(main);

const door=new THREE.Mesh(
 new THREE.BoxGeometry(4,7,.5),darkStone
);
door.position.set(0,3.5,-70.8);
castle.add(door);

for(const x of [-9,9]){
 for(const z of [-83,-73]){
  const tower=new THREE.Mesh(
   new THREE.CylinderGeometry(2.5,3,22,12),stoneMat
  );
  tower.position.set(x,11,z);
  tower.castShadow=true;
  castle.add(tower);

  const roof=new THREE.Mesh(
   new THREE.ConeGeometry(3.5,7,12),purple
  );
  roof.position.set(x,25,z);
  castle.add(roof);
 }
}

const windows=[];
for(let x of [-6,0,6]){
 const w=new THREE.Mesh(
  new THREE.BoxGeometry(1.2,2,.3),
  new THREE.MeshStandardMaterial({
   color:0xffd0a0,emissive:0xff9a6b,emissiveIntensity:1
  })
 );
 w.position.set(x,9,-70.7);
 castle.add(w);
}

// TREES
const trees=new THREE.Group();
scene.add(trees);

const trunkMat=material(0x604332);
const leafMat=material(0x263f38);

function createTree(x,z,s){
 const g=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.3,.55,5,9),trunkMat
 );
 trunk.position.y=2.5;
 g.add(trunk);

 for(let i=0;i<3;i++){
  const leaves=new THREE.Mesh(
   new THREE.IcosahedronGeometry(2.7-i*.35,2),leafMat
  );
  leaves.position.y=5+i*1.3;
  leaves.scale.set(1,1.25,1);
  g.add(leaves);
 }
 g.position.set(x,0,z);
 g.scale.setScalar(s);
 g.traverse(o=>{if(o.isMesh)o.castShadow=true});
 trees.add(g);
}

for(let i=0;i<80;i++){
 const a=i*2.399;
 const r=25+Math.random()*28;
 createTree(Math.cos(a)*r,Math.sin(a)*r-25,.7+Math.random()*.65);
}

// CRYSTALS
const crystalMat=new THREE.MeshPhysicalMaterial({
 color:0xf2aaff,metalness:.35,roughness:.12,
 emissive:0x8a24ca,emissiveIntensity:1.2,
 clearcoat:1
});

const crystals=[];
for(let i=0;i<14;i++){
 const g=new THREE.Group();
 const c=new THREE.Mesh(
  new THREE.OctahedronGeometry(.9,0),crystalMat
 );
 c.scale.y=2;
 c.castShadow=true;
 g.add(c);
 const light=new THREE.PointLight(0xd65aff,3,8);
 g.add(light);
 const a=i*Math.PI*2/14;
 g.position.set(Math.cos(a)*(12+i%3*3),1,Math.sin(a)*(12+i%3*3)-20);
 scene.add(g);
 crystals.push(g);
}

// PORTAL
const portal=new THREE.Group();
const ring=new THREE.Mesh(
 new THREE.TorusGeometry(3,.2,16,64),
 new THREE.MeshStandardMaterial({
  color:0xf5b5ff,emissive:0xa52bdb,emissiveIntensity:2
 })
);
portal.add(ring);
portal.position.set(0,4,-40);
portal.add(new THREE.PointLight(0xd050ff,18,20));
scene.add(portal);

// FLAME BUNNY
// GLB model is loaded from assets when supplied.
let hero=null,mixer=null;
let clips={},currentAction=null;
let modelLoaded=false;

const loader=new GLTFLoader();

function showMessage(t){
 $('msg').textContent=t;
 $('msg').style.display='block';
 setTimeout(()=>$('msg').style.display='none',2000);
}

loader.load(
 'assets/characters/flame-bunny.glb',
 gltf=>{
  hero=gltf.scene;
  hero.position.set(0,0,5);
  hero.scale.setScalar(1);
  hero.traverse(o=>{
   if(o.isMesh){
    o.castShadow=true;
    o.receiveShadow=true;
   }
  });
  scene.add(hero);
  mixer=new THREE.AnimationMixer(hero);
  gltf.animations.forEach(c=>{
   clips[c.name.toLowerCase()]=mixer.clipAction(c);
  });
  modelLoaded=true;
  showMessage('Flame Bunny ready!');
 },
 undefined,
 ()=>{
  // Visual placeholder until the professional model is supplied.
  hero=createPlaceholder();
  scene.add(hero);
  modelLoaded=true;
  showMessage('Prototype ready - GLB model still needed');
 }
);

// Temporary visual stand-in, not a professional character model.
function createPlaceholder(){
 const g=new THREE.Group();

 function part(geo,mat,x,y,z){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  m.castShadow=true;
  g.add(m);
  return m;
 }

 part(new THREE.CapsuleGeometry(.42,.8,6,12),pink,0,1.4,0);
 part(new THREE.SphereGeometry(.53,24,20),pink,0,2.45,0);
 part(new THREE.CapsuleGeometry(.13,.9,5,12),purple,-.28,3.2,0);
 part(new THREE.CapsuleGeometry(.13,.9,5,12),purple,.28,3.2,0);

 part(new THREE.SphereGeometry(.09),darkStone,-.2,2.5,.48);
 part(new THREE.SphereGeometry(.09),darkStone,.2,2.5,.48);

 for(let s of [-1,1]){
  const arm=part(new THREE.CapsuleGeometry(.17,.65,5,10),pink,s*.53,1.55,0);
  arm.rotation.z=s*.25;
  part(new THREE.CapsuleGeometry(.18,.5,5,10),purple,s*.23,.55,0);
 }

 const cape=part(new THREE.ConeGeometry(.7,2,12),purple,0,1.1,-.65);
 cape.rotation.x=-.2;

 const sword=part(new THREE.BoxGeometry(.1,1.5,.12),gold,.75,1.5,.2);
 sword.rotation.z=-.2;

 const shield=part(new THREE.BoxGeometry(.8,1,.16),gold,-.72,1.45,.2);
 shield.rotation.z=.1;

 g.position.set(0,0,5);
 return g;
}

function playAnim(name){
 if(!mixer)return;
 const key=Object.keys(clips).find(k=>k.includes(name));
 if(!key)return;
 const next=clips[key];
 if(currentAction===next)return;
 if(currentAction)currentAction.fadeOut(.2);
 next.reset().fadeIn(.2).play();
 currentAction=next;
}

// GAME
let active=false;
let jumping=false,jumpV=0;
let direction={x:0,y:0};
let cameraAngle=0;
let collected=0;

$('play').onclick=()=>{
 active=true;
 $('menu').style.display='none';
 $('hud').style.display='flex';
 $('controls').style.display='flex';
 $('back').style.display='block';
 if(hero)hero.position.set(0,0,5);
 showMessage('Welcome to Kingdom of Lumina!');
};

$('multi').onclick=()=>{
 showMessage('Online multiplayer - server development required');
};

$('back').onclick=()=>{
 active=false;
 $('menu').style.display='flex';
 $('hud').style.display='none';
 $('controls').style.display='none';
 $('back').style.display='none';
};

// JOYSTICK
const stick=$('stick');
const knob=$('knob');
let pointer=null;

function joystick(e){
 const r=stick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const d=Math.max(1,Math.hypot(x,y));
 const m=Math.min(36,d);
 direction.x=x/d*m/36;
 direction.y=y/d*m/36;
 knob.style.left=(31+direction.x*30)+'px';
 knob.style.top=(31+direction.y*30)+'px';
}

stick.onpointerdown=e=>{
 pointer=e.pointerId;
 stick.setPointerCapture(pointer);
 joystick(e);
};
stick.onpointermove=e=>{
 if(pointer===e.pointerId)joystick(e);
};
function resetStick(){
 pointer=null;
 direction={x:0,y:0};
 knob.style.left='31px';
 knob.style.top='31px';
}
stick.onpointerup=resetStick;
stick.onpointercancel=resetStick;

// ACTIONS
$('jump').onclick=()=>{
 if(!active||jumping)return;
 jumping=true;
 jumpV=8;
 playAnim('jump');
};
$('attack').onclick=()=>{
 if(active){
  playAnim('attack');
  showMessage('LEGENDARY SWORD!');
 }
};
$('magic').onclick=()=>{
 if(active){
  playAnim('magic');
  showMessage('PINK FIRE BLAST!');
  const flash=new THREE.PointLight(0xff4bd9,20,15);
  flash.position.copy(hero.position);
  flash.position.y+=2;
  scene.add(flash);
  setTimeout(()=>scene.remove(flash),400);
 }
};

// CAMERA ROTATION
let dragging=false,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(active){dragging=true;lastX=e.clientX}
});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
 if(!dragging)return;
 cameraAngle-=(e.clientX-lastX)*.006;
 lastX=e.clientX;
});

// LOOP
const clock=new THREE.Clock();

function update(dt){
 const t=clock.elapsedTime;

 if(active&&hero){
  const f=new THREE.Vector3(-Math.sin(cameraAngle),0,-Math.cos(cameraAngle));
  const s=new THREE.Vector3(Math.cos(cameraAngle),0,-Math.sin(cameraAngle));
  const move=f.clone().multiplyScalar(-direction.y)
  .add(s.multiplyScalar(direction.x));

  const moving=move.length()>.1;

  if(moving){
   move.normalize();
   hero.position.addScaledVector(move,dt*5);
   hero.rotation.y=Math.atan2(move.x,move.z);
   playAnim('run');
  }else if(!jumping)playAnim('idle');

  if(jumping){
   jumpV-=18*dt;
   hero.position.y+=jumpV*dt;
   if(hero.position.y<=0){
    hero.position.y=0;
    jumping=false;
    playAnim('idle');
   }
  }

  hero.position.x=THREE.MathUtils.clamp(hero.position.x,-35,35);
  hero.position.z=THREE.MathUtils.clamp(hero.position.z,-75,30);

  if(mixer)mixer.update(dt);

  const offset=new THREE.Vector3(
   Math.sin(cameraAngle)*8,4.5,Math.cos(cameraAngle)*8
  );
  camera.position.lerp(hero.position.clone().add(offset),.09);
  camera.lookAt(hero.position.x,hero.position.y+2,hero.position.z);

  crystals.forEach(c=>{
   if(!c.visible)return;
   if(c.position.distanceTo(hero.position)<2){
    c.visible=false;
    collected++;
    showMessage('CRYSTAL COLLECTED! '+collected);
   }
  });
 }

 crystals.forEach((c,i)=>{
  c.rotation.y+=dt*.6;
  c.position.y=1+Math.sin(t*2+i)*.15;
 });

 portal.rotation.y+=dt*.35;
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 update(dt);
 renderer.render(scene,camera);
}
animate();

camera.position.set(0,7,15);
camera.lookAt(0,2,-10);

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
