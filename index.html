
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CUTE WARRIORS 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#100c20;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
#loading{
 position:fixed;inset:0;z-index:10;background:#130c25;
 display:flex;align-items:center;justify-content:center;
 text-align:center;padding:25px
}
#loading h1{color:#ff9de5;text-shadow:0 0 25px #d044ff}
#loading p{color:#d8c3e9;font-size:13px;line-height:1.6}
#menu{
 position:fixed;inset:0;z-index:5;display:flex;
 align-items:center;justify-content:center;text-align:center;
 background:linear-gradient(145deg,#180c2bdc,#43164bcc,#170b2bdd);
 padding:20px
}
.card{
 width:min(420px,100%);padding:28px 20px;
 border:1px solid #d58aff;border-radius:25px;
 background:linear-gradient(145deg,#39204dee,#170d2bee);
 box-shadow:0 0 40px #bb5aff55
}
.logo{font-size:clamp(38px,10vw,64px);font-weight:1000;
 color:#ffb1ed;text-shadow:0 0 15px #ed65dd,0 0 35px #843aff}
button{
 border:1px solid #f5caff;border-radius:13px;
 padding:15px;color:white;font-weight:bold;
 background:linear-gradient(135deg,#ed72c9,#7835c5);
 cursor:pointer;touch-action:none
}
button:active{transform:scale(.95)}
.menuButtons{display:grid;gap:12px;margin-top:25px}
#hud{position:fixed;top:12px;left:12px;right:12px;
 display:none;justify-content:space-between;pointer-events:none}
.panel{background:#1d102ddd;border:1px solid #d18aff;
 border-radius:12px;padding:10px;font-size:12px}
#mission{
 position:fixed;top:75px;left:50%;transform:translateX(-50%);
 background:#1d102ddd;border:1px solid #d18aff;
 border-radius:12px;padding:10px;font-size:12px;
 display:none;white-space:nowrap
}
#controls{
 position:fixed;bottom:20px;left:15px;right:15px;
 display:none;justify-content:space-between;align-items:end;
 pointer-events:none
}
#stick{
 width:110px;height:110px;border-radius:50%;
 border:3px solid #e5a5ff;background:#bd69ff35;
 position:relative;pointer-events:auto;touch-action:none
}
#knob{
 position:absolute;left:31px;top:31px;width:42px;height:42px;
 border-radius:50%;background:linear-gradient(135deg,#ffb5e9,#9445e5)
}
.actions{display:flex;gap:8px;pointer-events:auto}
.actions button{width:62px;height:62px;border-radius:50%;padding:4px;font-size:10px}
#message{
 position:fixed;bottom:145px;left:50%;transform:translateX(-50%);
 background:#21132fe8;border:1px solid #d18aff;border-radius:12px;
 padding:10px 14px;font-size:12px;display:none;white-space:nowrap
}
#back{
 position:fixed;top:65px;right:12px;display:none;
 padding:10px 13px;z-index:3
}
</style>
</head>
<body>

<div id="loading">
 <div>
  <h1>CUTE WARRIORS 2</h1>
  <p id="loadText">Se pregătește Regatul Lumina...</p>
 </div>
</div>

<div id="menu">
 <div class="card">
  <div style="font-size:55px">💎</div>
  <div class="logo">CUTE<br>WARRIORS 2</div>
  <p style="letter-spacing:4px;color:#eac9ff;font-size:11px">CINEMATIC EDITION</p>
  <p>ONE WORLD. MANY WARRIORS. ONE ADVENTURE.</p>
  <div class="menuButtons">
   <button id="play">⚔️ PLAY STORY MODE</button>
   <button id="multi">🌐 MULTIPLAYER</button>
  </div>
  <p style="font-size:11px;color:#d5bce8;margin-top:22px">
   iOS • ANDROID • 3D FANTASY RPG
  </p>
 </div>
</div>

<div id="hud">
 <div class="panel">❤️ 100<br>⭐ LEVEL 1</div>
 <div class="panel">CUTE WARRIORS 2<br>REGATUL LUMINA</div>
</div>

<div id="mission">💎 Explorează Regatul Lumina</div>
<div id="message"></div>
<button id="back">MENU</button>

<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div class="actions">
  <button id="jump">⬆️<br>JUMP</button>
  <button id="attack">⚔️<br>ATTACK</button>
  <button id="magic">🔥<br>MAGIC</button>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

import {GLTFLoader} from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

const $=id=>document.getElementById(id);

let scene,camera,renderer,clock,hero,mixer;
let animations={};
let active=false,loaded=false;
let movement={x:0,y:0};
let jumping=false,verticalSpeed=0;
let cameraAngle=0;
let collected=0;
let crystals=[];
let currentAction=null;

const loading=$('loading');
const loadText=$('loadText');

function message(text){
 $('message').textContent=text;
 $('message').style.display='block';
 setTimeout(()=>$('message').style.display='none',2200);
}

// SCENE
scene=new THREE.Scene();
scene.background=new THREE.Color(0x8d7bb0);
scene.fog=new THREE.Fog(0x8d7bb0,35,120);

camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,250
);

renderer=new THREE.WebGLRenderer({
 antialias:true,alpha:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

clock=new THREE.Clock();

// LIGHTING
scene.add(new THREE.HemisphereLight(0xe9d9ff,0x342747,2.2));

const sun=new THREE.DirectionalLight(0xffe6f5,3);
sun.position.set(-20,35,15);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const pinkLight=new THREE.PointLight(0xd75cff,45,55);
pinkLight.position.set(8,9,-15);
scene.add(pinkLight);

const goldLight=new THREE.PointLight(0xffd68b,30,35);
goldLight.position.set(-12,7,10);
scene.add(goldLight);

// ENVIRONMENT
const groundMat=new THREE.MeshStandardMaterial({
 color:0x536c63,roughness:1
});
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(180,180),groundMat
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.15;
ground.receiveShadow=true;
scene.add(ground);

// STONE PATH
const path=new THREE.Mesh(
 new THREE.PlaneGeometry(8,85),
 new THREE.MeshStandardMaterial({color:0x83748e,roughness:.9})
);
path.rotation.x=-Math.PI/2;
path.position.set(0,-.12,-20);
scene.add(path);

// CASTLE
const castle=new THREE.Group();
scene.add(castle);

const stone=new THREE.MeshStandardMaterial({
 color:0x75618c,roughness:.7
});
const castleBase=new THREE.Mesh(
 new THREE.BoxGeometry(16,9,8),stone
);
castleBase.position.set(0,4.5,-65);
castle.add(castleBase);

for(let x of [-6,6]){
 const tower=new THREE.Mesh(
  new THREE.CylinderGeometry(2,2.4,16,12),stone
 );
 tower.position.set(x,8,-65);
 castle.add(tower);

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(2.8,5,12),
  new THREE.MeshStandardMaterial({color:0x9b4d9f})
 );
 roof.position.set(x,18,-65);
 castle.add(roof);
}

// TREES
const treeMat=new THREE.MeshStandardMaterial({
 color:0x344f46,roughness:1
});
const trunkMat=new THREE.MeshStandardMaterial({
 color:0x76513e
});

function tree(x,z,s=1){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.3,.5,3,8),trunkMat
 );
 trunk.position.y=1.5;
 g.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.IcosahedronGeometry(2.2,1),treeMat
 );
 leaves.position.y=4;
 leaves.scale.set(1,1.3,1);
 g.add(leaves);
 g.scale.setScalar(s);
 g.position.set(x,0,z);
 g.traverse(o=>{if(o.isMesh)o.castShadow=true});
 scene.add(g);
}

for(let i=0;i<65;i++){
 const a=i*2.399;
 const r=24+(i%5)*5;
 tree(Math.cos(a)*r,Math.sin(a)*r,0.8+(i%4)*.15);
}

// CRYSTALS
const crystalMat=new THREE.MeshStandardMaterial({
 color:0xe68cff,
 emissive:0x922bd1,
 emissiveIntensity:1.7,
 metalness:.4,roughness:.2
});

for(let i=0;i<12;i++){
 const a=i*Math.PI/6;
 const r=10+(i%3)*5;
 const g=new THREE.Group();

 const c=new THREE.Mesh(
  new THREE.OctahedronGeometry(.8,0),crystalMat
 );
 c.scale.y=1.8;
 g.add(c);

 const light=new THREE.PointLight(0xd65aff,3,7);
 g.add(light);
 g.position.set(Math.cos(a)*r,1,Math.sin(a)*r-15);
 scene.add(g);
 crystals.push(g);
}

// PORTAL
const portal=new THREE.Group();
const portalRing=new THREE.Mesh(
 new THREE.TorusGeometry(3,.18,16,64),
 new THREE.MeshStandardMaterial({
  color:0xf4aaff,emissive:0xb536ed,
  emissiveIntensity:2,metalness:.5
 })
);
portal.add(portalRing);
const portalGlow=new THREE.PointLight(0xd54aff,12,20);
portal.add(portalGlow);
portal.position.set(0,3,-38);
scene.add(portal);

// HERO MODEL
// Real character is loaded from the GLB asset.
const loader=new GLTFLoader();

loadText.textContent='Se încarcă modelul Flame Bunny...';

loader.load(
 'assets/characters/flame-bunny.glb',
 gltf=>{
  hero=gltf.scene;
  hero.position.set(0,0,5);
  hero.scale.setScalar(1);
  hero.traverse(o=>{
   if(o.isMesh){
    o.castShadow=true;
    o.receiveShadow=true;
   }
  });
  scene.add(hero);

  mixer=new THREE.AnimationMixer(hero);

  gltf.animations.forEach(clip=>{
   animations[clip.name.toLowerCase()]=mixer.clipAction(clip);
  });

  loaded=true;
  loadText.textContent='Flame Bunny este pregătit!';
  setTimeout(()=>loading.style.display='none',900);
 },
 undefined,
 error=>{
  loadText.textContent=
  'Modelul Flame Bunny nu a fost găsit. Adaugă fișierul assets/characters/flame-bunny.glb pentru a-l vedea.';
  console.error(error);
 }
);

// ANIMATIONS
function playAnimation(name){
 if(!mixer)return;
 const key=Object.keys(animations).find(k=>k.includes(name));
 if(!key)return;
 const next=animations[key];
 if(currentAction===next)return;
 if(currentAction)currentAction.fadeOut(.2);
 next.reset().fadeIn(.2).play();
 currentAction=next;
}

// START
function start(){
 if(!loaded){
  message('Modelul Flame Bunny încă nu este disponibil.');
  return;
 }
 active=true;
 $('menu').style.display='none';
 $('hud').style.display='flex';
 $('mission').style.display='block';
 $('controls').style.display='flex';
 $('back').style.display='block';
 clock.start();
 playAnimation('idle');
}

// BUTTONS
$('play').onclick=start;

$('multi').onclick=()=>{
 message('Multiplayer online va necesita serverul dedicat.');
};

$('back').onclick=()=>{
 active=false;
 $('menu').style.display='flex';
 $('hud').style.display='none';
 $('mission').style.display='none';
 $('controls').style.display='none';
 $('back').style.display='none';
};

// JOYSTICK
const stick=$('stick');
const knob=$('knob');
let pointer=null;

function moveStick(e){
 const r=stick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const d=Math.max(1,Math.hypot(x,y));
 const m=Math.min(36,d);
 movement.x=x/d*m/36;
 movement.y=y/d*m/36;
 knob.style.left=(31+movement.x*30)+'px';
 knob.style.top=(31+movement.y*30)+'px';
}

stick.onpointerdown=e=>{
 pointer=e.pointerId;
 stick.setPointerCapture(pointer);
 moveStick(e);
};
stick.onpointermove=e=>{
 if(pointer===e.pointerId)moveStick(e);
};
function release(){
 pointer=null;
 movement.x=movement.y=0;
 knob.style.left='31px';
 knob.style.top='31px';
}
stick.onpointerup=release;
stick.onpointercancel=release;

// ACTIONS
$('jump').onclick=()=>{
 if(!active||jumping)return;
 jumping=true;
 verticalSpeed=8;
 playAnimation('jump');
};

$('attack').onclick=()=>{
 if(!active)return;
 playAnimation('attack');
 message('⚔️ LEGENDARY SWORD!');
};

$('magic').onclick=()=>{
 if(!active)return;
 playAnimation('magic');
 message('🔥 PINK FIRE BLAST!');
};

// CAMERA ROTATION
let dragging=false,lastX=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 if(!active)return;
 dragging=true;
 lastX=e.clientX;
});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
 if(!dragging)return;
 cameraAngle-=(e.clientX-lastX)*.006;
 lastX=e.clientX;
});

// GAME UPDATE
function update(dt){
 if(!active||!hero)return;

 const t=clock.elapsedTime;

 const forward=new THREE.Vector3(
  -Math.sin(cameraAngle),0,-Math.cos(cameraAngle)
 );
 const side=new THREE.Vector3(
  Math.cos(cameraAngle),0,-Math.sin(cameraAngle)
 );

 const direction=forward.clone()
  .multiplyScalar(-movement.y)
  .add(side.multiplyScalar(movement.x));

 const moving=direction.length()>.15;

 if(moving){
  direction.normalize();
  hero.position.addScaledVector(direction,dt*5);
  hero.rotation.y=Math.atan2(direction.x,direction.z);
  playAnimation('run');
 }else if(!jumping){
  playAnimation('idle');
 }

 if(jumping){
  verticalSpeed-=19*dt;
  hero.position.y+=verticalSpeed*dt;
  if(hero.position.y<=0){
   hero.position.y=0;
   jumping=false;
   playAnimation('idle');
  }
 }

 hero.position.x=THREE.MathUtils.clamp(hero.position.x,-28,28);
 hero.position.z=THREE.MathUtils.clamp(hero.position.z,-65,28);

 if(mixer)mixer.update(dt);

 // THIRD PERSON CAMERA
 const offset=new THREE.Vector3(
  Math.sin(cameraAngle)*7,
  4.2,
  Math.cos(cameraAngle)*7
 );

 camera.position.lerp(
  hero.position.clone().add(offset),.09
 );
 camera.lookAt(
  hero.position.x,
  hero.position.y+2.2,
  hero.position.z
 );

 // WORLD EFFECTS
 portal.rotation.y+=dt*.4;
 crystals.forEach((c,i)=>{
  c.rotation.y+=dt*.7;
  c.position.y=1+Math.sin(t*2+i)*.2;
 });

 // CRYSTAL COLLECTION
 crystals.forEach(c=>{
  if(!c.visible)return;
  if(c.position.distanceTo(hero.position)<1.8){
   c.visible=false;
   collected++;
   $('mission').textContent='💎 Cristale: '+collected;
   message('💎 CRISTAL COLECTAT!');
  }
 });
}

// LOOP
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 update(dt);
 renderer.render(scene,camera);
}
animate();

// RESIZE
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
