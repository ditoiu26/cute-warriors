
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cute Warriors</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#180d32;color:white;font-family:Arial;overflow:hidden;touch-action:none}
#game{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:15px;background:radial-gradient(circle at 50% 45%,#643b91,#180d32 75%)}
h1{margin:5px;color:#ffb6ef;text-shadow:0 0 15px #e879f9}
#stats{width:100%;max-width:500px;display:flex;justify-content:space-between;gap:10px}
.panel{background:#ffffff20;border:1px solid #ffffff40;border-radius:15px;padding:10px}
#arena{width:min(90vw,420px);height:min(55vh,420px);position:relative;border:4px solid #dca5ff;border-radius:50%;background:radial-gradient(ellipse,#c48be7,#633d91 70%,#32174d);box-shadow:0 0 30px #d946ef;overflow:hidden}
.fighter{position:absolute;transform:translate(-50%,-50%);font-size:48px;filter:drop-shadow(0 5px 5px #250d37);user-select:none}
#hero{font-size:62px;z-index:3}
.enemy{font-size:46px}
#controls{width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center}
#stick{width:115px;height:115px;border-radius:50%;background:#ffffff30;border:3px solid #e9b5ff;position:relative}
#knob{width:48px;height:48px;border-radius:50%;background:#f5b4ff;position:absolute;left:31px;top:31px}
button{border:0;border-radius:50%;width:78px;height:78px;background:linear-gradient(140deg,#ff9ce8,#9c65ef);color:white;font-weight:bold;font-size:14px;box-shadow:0 4px 15px #e879f9}
button:active{transform:scale(.9)}
#message{font-weight:bold;color:#ffe0ff;text-align:center;min-height:25px}
#restart{width:auto;height:auto;border-radius:15px;padding:12px 20px}
</style>
</head>
<body>
<div id="game">
<h1>🐰 CUTE WARRIORS</h1>
<div id="stats">
<div class="panel">❤️ Viață: <span id="hp">100</span></div>
<div class="panel">⭐ Scor: <span id="score">0</span></div>
<div class="panel">👾 Inamici: <span id="left">3</span></div>
</div>
<div id="arena">
<div id="hero" class="fighter">🐰</div>
<div id="enemies"></div>
</div>
<div id="message">Flame Bunny, pregătește-te de luptă!</div>
<div id="controls">
<div id="stick"><div id="knob"></div></div>
<button id="attack">⚔️<br>ATAC</button>
<button id="special">🔥<br>SPECIAL</button>
</div>
<button id="restart">REÎNCEPE LUPTA</button>
</div>
<script>
const arena=document.querySelector("#arena");
const hero=document.querySelector("#hero");
const enemiesBox=document.querySelector("#enemies");
const hpText=document.querySelector("#hp");
const scoreText=document.querySelector("#score");
const leftText=document.querySelector("#left");
const message=document.querySelector("#message");
const knob=document.querySelector("#knob");
let x=50,y=65,hp=100,score=0,alive=true;
let enemies=[],dx=0,dy=0,lastHit=0;
function spawn(){
enemiesBox.innerHTML="";
enemies=[];
for(let i=0;i<3;i++){
let el=document.createElement("div");
el.className="fighter enemy";
el.textContent=["👾","🐲","👻"][i];
enemiesBox.appendChild(el);
enemies.push({el,x:20+i*30,y:22,hp:2});
}
}
function draw(){
hero.style.left=x+"%";hero.style.top=y+"%";
enemies.forEach(e=>{e.el.style.left=e.x+"%";e.el.style.top=e.y+"%"});
}
function update(){
if(!alive)return;
x=Math.max(9,Math.min(91,x+dx*.45));
y=Math.max(12,Math.min(88,y+dy*.45));
enemies.forEach(e=>{
let vx=x-e.x,vy=y-e.y,d=Math.hypot(vx,vy);
if(d>12){e.x+=vx/d*.12;e.y+=vy/d*.12}
if(d<13&&Date.now()-lastHit>900){
hp=Math.max(0,hp-5);hpText.textContent=hp;lastHit=Date.now();
if(hp===0)end(false);
}
});
draw();requestAnimationFrame(update);
}
function attack(power){
if(!alive)return;
let target=enemies.find(e=>Math.hypot(e.x-x,e.y-y)<35);
if(target){
target.hp-=power;
message.textContent="✨ Pink Fire Blast!";
if(target.hp<=0){
target.el.remove();enemies=enemies.filter(e=>e!==target);
score+=100;scoreText.textContent=score;leftText.textContent=enemies.length;
if(!enemies.length)end(true);
}
}else message.textContent="Apropie-te de un adversar!";
}
function end(win){
alive=false;dx=dy=0;
message.textContent=win?"🏆 VICTORIE! Flame Bunny a câștigat!":"💜 Ai pierdut! Încearcă din nou!";
}
document.querySelector("#attack").onclick=()=>attack(1);
document.querySelector("#special").onclick=()=>attack(2);
document.querySelector("#restart").onclick=()=>{
x=50;y=65;hp=100;score=0;alive=true;
hpText.textContent=hp;scoreText.textContent=score;leftText.textContent=3;
message.textContent="Flame Bunny, pregătește-te de luptă!";
spawn();draw();requestAnimationFrame(update);
};
let active=false;
const stick=document.querySelector("#stick");
stick.addEventListener("pointerdown",e=>{active=true;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener("pointermove",e=>{if(active)moveStick(e)});
function moveStick(e){
let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
let a=Math.atan2(e.clientY-cy,e.clientX-cx),d=Math.min(35,Math.hypot(e.clientX-cx,e.clientY-cy));
dx=Math.cos(a)*d/35;dy=Math.sin(a)*d/35;
knob.style.left=(33+dx*28)+"px";knob.style.top=(33+dy*28)+"px";
}
function release(){active=false;dx=dy=0;knob.style.left="31px";knob.style.top="31px"}
stick.addEventListener("pointerup",release);
stick.addEventListener("pointercancel",release);
spawn();draw();requestAnimationFrame(update);
</script>
</body>
</html>
