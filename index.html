
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CUTE WARRIORS 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#11101d;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#673c83,#130e24 75%);padding:20px;text-align:center}
.card{width:min(420px,100%);padding:28px 20px;border:1px solid #e7aaff;border-radius:24px;background:#21152def;box-shadow:0 0 55px #bd6aff66}
.logo{font-size:clamp(38px,10vw,62px);font-weight:1000;color:#ffb5e8;text-shadow:0 0 25px #d45bff}
button{border:1px solid #f3c9ff;border-radius:14px;padding:15px;color:white;font-weight:bold;background:linear-gradient(135deg,#e87bc7,#7339b4);touch-action:none}
.buttons{display:grid;gap:12px;margin-top:25px}
#hud{display:none;position:fixed;top:12px;left:12px;right:12px;justify-content:space-between;pointer-events:none}
.panel{background:#191326dd;border:1px solid #d39bed;border-radius:12px;padding:10px;font-size:12px}
#controls{display:none;position:fixed;bottom:18px;left:15px;right:15px;justify-content:space-between;align-items:end;pointer-events:none}
#stick{width:110px;height:110px;border:3px solid #dfa5ff;border-radius:50%;background:#b65cff35;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:42px;height:42px;left:31px;top:31px;border-radius:50%;background:#eea6f4}
.actions{display:flex;gap:8px;pointer-events:auto}
.actions button{width:62px;height:62px;border-radius:50%;padding:3px;font-size:10px}
#msg{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);background:#21152ddd;border:1px solid #d39bed;border-radius:12px;padding:10px;display:none;font-size:12px;white-space:nowrap}
#back{display:none;position:fixed;top:65px;right:12px;padding:10px}
#loading{display:none;position:fixed;inset:0;background:#130e24;z-index:4;align-items:center;justify-content:center;text-align:center}
</style>
</head>
<body>

<div id="menu">
 <div class="card">
  <div style="font-size:55px">💎</div>
  <div class="logo">CUTE<br>WARRIORS 2</div>
  <p style="letter-spacing:4px;color:#e6c3f9">CINEMATIC EDITION</p>
  <p>ENTER THE KINGDOM OF LUMINA</p>
  <div class="buttons">
   <button id="play">⚔️ ENTER WORLD</button>
   <button id="multi">🌐 MULTIPLAYER</button>
  </div>
  <p style="font-size:11px;color:#cdb6de">iOS • ANDROID • FANTASY RPG</p>
 </div>
</div>

<div id="loading">LOADING KINGDOM OF LUMINA...</div>

<div id="hud">
 <div class="panel">❤️ 100<br>⭐ LEVEL 1</div>
 <div class="panel">KINGDOM OF LUMINA</div>
</div>
<div id="msg"></div>
<button id="back">MENU</button>

<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div class="actions">
  <button id="jump">⬆️<br>JUMP</button>
  <button id="attack">⚔️<br>ATTACK</button>
  <button id="magic">🔥<br>MAGIC</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const $=id=>document.getElementById(id);

let scene,camera,renderer,hero,mixer;
let active=false,jumping=false,jumpV=0;
let cameraAngle=0;
let direction={x:0,y:0};
let collected=0;
let crystals=[],portal;
let clock=new THREE.Clock();

function mat(color,roughness=.8,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

const pink=mat(0xd85ebd,.3,.5);
const purple=mat(0x633a91,.3,.6);
const gold=mat(0xd5a64e,.3,.8);
const stone=mat(0x777184);
const dark=mat(0x393346);

function makePart(g,geo,material,x,y,z){
 const m=new THREE.Mesh(geo,material);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 g.add(m);
 return m;
}

function createHero(){
 const g=new THREE.Group();
 const body=new THREE.Group();
 g.add(body);
 g.userData.body=body;

 makePart(body,new THREE.CapsuleGeometry(.42,.85,6,12),pink,0,1.35,0);
 makePart(body,new THREE.SphereGeometry(.52,24,20),pink,0,2.45,0);

 // Rabbit ears
 for(const s of [-1,1]){
  const ear=makePart(body,new THREE.CapsuleGeometry(.14,.85,6,12),purple,s*.27,3.25,0);
  ear.rotation.z=s*.12;
  makePart(body,new THREE.CapsuleGeometry(.08,.7,6,12),pink,s*.27,3.25,.13);

  // Arms
  const arm=new THREE.Group();
  arm.position.set(s*.5,1.7,0);
  body.add(arm);
  makePart(arm,new THREE.CapsuleGeometry(.16,.65,5,10),pink,0,-.35,0);
  makePart(arm,new THREE.SphereGeometry(.19),gold,0,-.8,.02);
  if(s===-1)g.userData.leftArm=arm;
  else g.userData.rightArm=arm;

  // Legs
  const leg=new THREE.Group();
  leg.position.set(s*.23,.85,0);
  body.add(leg);
  makePart(leg,new THREE.CapsuleGeometry(.18,.6,5,10),purple,0,-.3,0);
  makePart(leg,new THREE.SphereGeometry(.21),gold,0,-.65,.12);
  if(s===-1)g.userData.leftLeg=leg;
  else g.userData.rightLeg=leg;
 }

 // Eyes
 for(const s of [-1,1]){
  makePart(body,new THREE.SphereGeometry(.075,12,12),dark,s*.2,2.5,.46);
 }
 // Gold chest armor
 makePart(body,new THREE.BoxGeometry(.65,.45,.15),gold,0,1.75,.39);

 // Cape
 const cape=makePart(body,new THREE.ConeGeometry(.65,1.7,12),purple,0,1,-.55);
 cape.rotation.x=-.25;
 g.userData.cape=cape;

 // Sword and shield
 const sword=new THREE.Group();
 sword.position.set(.62,1.4,.15);
 body.add(sword);
 makePart(sword,new THREE.BoxGeometry(.11,1.35,.13),gold,0,.65,0);
 makePart(sword,new THREE.BoxGeometry(.48,.1,.2),gold,0,.05,0);
 g.userData.sword=sword;

 const shield=new THREE.Group();
 shield.position.set(-.65,1.5,.2);
 body.add(shield);
 makePart(shield,new THREE.BoxGeometry(.75,.95,.18),gold,0,0,0);
 makePart(shield,new THREE.BoxGeometry(.45,.65,.2),purple,0,0,.1);

 g.position.set(0,0,5);
 return g;
}

function addTree(x,z,s){
 const g=new THREE.Group();
 makePart(g,new THREE.CylinderGeometry(.3,.55,5,9),mat(0x604332),0,2.5,0);
 for(let i=0;i<3;i++){
  makePart(g,new THREE.IcosahedronGeometry(2.5-i*.3,1),mat(0x263f38),0,5+i*1.3,0);
 }
 g.position.set(x,0,z);
 g.scale.setScalar(s);
 scene.add(g);
}

function createWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x9990b3);
 scene.fog=new THREE.FogExp2(0x9990b3,.008);

 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
 camera.position.set(0,7,15);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;
 document.body.insertBefore(renderer.domElement,document.body.firstChild);

 scene.add(new THREE.HemisphereLight(0xc9c3ff,0x292b35,2));

 const sun=new THREE.DirectionalLight(0xffd9c0,3);
 sun.position.set(-35,55,25);
 sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);
 sun.shadow.camera.left=-60;
 sun.shadow.camera.right=60;
 sun.shadow.camera.top=60;
 sun.shadow.camera.bottom=-60;
 scene.add(sun);

 const atmosphere=new THREE.PointLight(0xd77bff,55,70);
 atmosphere.position.set(0,12,-20);
 scene.add(atmosphere);

 const ground=new THREE.Mesh(new THREE.PlaneGeometry(250,250),mat(0x465e50));
 ground.rotation.x=-Math.PI/2;
 ground.position.y=-.3;
 ground.receiveShadow=true;
 scene.add(ground);

 // Mountains
 for(let i=0;i<18;i++){
  const a=i*Math.PI*2/18;
  const mountain=new THREE.Mesh(
   new THREE.ConeGeometry(17,40+Math.random()*20,7),
   mat(0x655e78)
  );
  mountain.position.set(Math.cos(a)*95,12,Math.sin(a)*95-25);
  scene.add(mountain);
 }

 // Castle
 const castle=new THREE.Group();
 scene.add(castle);

 const main=new THREE.Mesh(new THREE.BoxGeometry(22,15,14),stone);
 main.position.set(0,7.5,-78);
 castle.add(main);

 const door=new THREE.Mesh(new THREE.BoxGeometry(4,7,.5),dark);
 door.position.set(0,3.5,-70.8);
 castle.add(door);

 for(const x of [-9,9]){
  for(const z of [-83,-73]){
   const tower=new THREE.Mesh(new THREE.CylinderGeometry(2.5,3,22,12),stone);
   tower.position.set(x,11,z);
   castle.add(tower);
   const roof=new THREE.Mesh(new THREE.ConeGeometry(3.5,7,12),purple);
   roof.position.set(x,25,z);
   castle.add(roof);
  }
 }

 // Trees
 for(let i=0;i<65;i++){
  const a=i*2.399;
  const r=25+Math.random()*28;
  addTree(Math.cos(a)*r,Math.sin(a)*r-25,.7+Math.random()*.65);
 }

 // Crystals
 crystals=[];
 const crystalMat=new THREE.MeshPhysicalMaterial({
  color:0xf2aaff,metalness:.35,roughness:.12,
  emissive:0x8a24ca,emissiveIntensity:1.2,clearcoat:1
 });

 for(let i=0;i<14;i++){
  const g=new THREE.Group();
  const c=new THREE.Mesh(new THREE.OctahedronGeometry(.9),crystalMat);
  c.scale.y=2;
  g.add(c);
  g.add(new THREE.PointLight(0xd65aff,3,8));
  const a=i*Math.PI*2/14;
  g.position.set(Math.cos(a)*(12+i%3*3),1,Math.sin(a)*(12+i%3*3)-20);
  scene.add(g);
  crystals.push(g);
 }

 portal=new THREE.Group();
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(3,.2,16,64),
  new THREE.MeshStandardMaterial({
   color:0xf5b5ff,emissive:0xa52bdb,emissiveIntensity:2
  })
 );
 portal.add(ring);
 portal.add(new THREE.PointLight(0xd050ff,18,20));
 portal.position.set(0,4,-40);
 scene.add(portal);

 hero=createHero();
 scene.add(hero);
 camera.lookAt(0,2,5);
}

function showMessage(t){
 $('msg').textContent=t;
 $('msg').style.display='block';
 clearTimeout(showMessage.timer);
 showMessage.timer=setTimeout(()=>$('msg').style.display='none',2200);
}

// Initialize the 3D world immediately, before PLAY is pressed.
try{
 createWorld();
 $('play').disabled=false;
}catch(e){
 console.error(e);
 showMessage('3D ERROR: '+e.message);
}

$('play').onclick=()=>{
 if(!scene||!renderer||!hero){
  showMessage('Lumea 3D nu s-a încărcat. Reîncarcă pagina.');
  return;
 }
 active=true;
 $('menu').style.display='none';
 $('hud').style.display='flex';
 $('controls').style.display='flex';
 $('back').style.display='block';
 hero.position.set(0,0,5);
 camera.position.set(0,5,14);
 camera.lookAt(0,2,5);
 showMessage('WELCOME TO KINGDOM OF LUMINA!');
};

$('multi').onclick=()=>{
 showMessage('MULTIPLAYER ONLINE - SERVER REQUIRED');
};

$('back').onclick=()=>{
 active=false;
 $('menu').style.display='flex';
 $('hud').style.display='none';
 $('controls').style.display='none';
 $('back').style.display='none';
};

// Joystick
const stick=$('stick'),knob=$('knob');
let pointer=null;

function joystick(e){
 const r=stick.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const d=Math.max(1,Math.hypot(x,y));
 const m=Math.min(36,d);
 direction.x=x/d*m/36;
 direction.y=y/d*m/36;
 knob.style.left=(31+direction.x*30)+'px';
 knob.style.top=(31+direction.y*30)+'px';
}
stick.onpointerdown=e=>{
 pointer=e.pointerId;
 stick.setPointerCapture(pointer);
 joystick(e);
};
stick.onpointermove=e=>{
 if(pointer===e.pointerId)joystick(e);
};
function resetStick(){
 pointer=null;
 direction={x:0,y:0};
 knob.style.left='31px';
 knob.style.top='31px';
}
stick.onpointerup=resetStick;
stick.onpointercancel=resetStick;

// Jump
$('jump').onclick=()=>{
 if(!active||jumping)return;
 jumping=true;
 jumpV=8;
};

// Attack
$('attack').onclick=()=>{
 if(!active)return;
 hero.userData.sword.rotation.z=-1.1;
 showMessage('LEGENDARY SWORD!');
 setTimeout(()=>{
  if(hero)hero.userData.sword.rotation.z=0;
 },350);
};

// Pink Fire Blast
$('magic').onclick=()=>{
 if(!active)return;
 showMessage('PINK FIRE BLAST!');
 const flash=new THREE.PointLight(0xff4bd9,30,18);
 flash.position.copy(hero.position);
 flash.position.y+=2;
 scene.add(flash);
 setTimeout(()=>scene.remove(flash),500);
};

// Camera drag
let dragging=false,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(active){dragging=true;lastX=e.clientX}
});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
 if(!dragging)return;
 cameraAngle-=(e.clientX-lastX)*.006;
 lastX=e.clientX;
});

// Animation
function update(dt){
 const t=clock.elapsedTime;

 if(active&&hero){
  const f=new THREE.Vector3(-Math.sin(cameraAngle),0,-Math.cos(cameraAngle));
  const s=new THREE.Vector3(Math.cos(cameraAngle),0,-Math.sin(cameraAngle));
  const move=f.clone().multiplyScalar(-direction.y)
   .add(s.multiplyScalar(direction.x));

  const moving=move.length()>.1;
  const body=hero.userData.body;

  if(moving){
   move.normalize();
   hero.position.addScaledVector(move,dt*5);
   hero.rotation.y=Math.atan2(move.x,move.z);

   const swing=Math.sin(t*9)*.65;
   hero.userData.leftArm.rotation.x=swing;
   hero.userData.rightArm.rotation.x=-swing;
   hero.userData.leftLeg.rotation.x=-swing;
   hero.userData.rightLeg.rotation.x=swing;
  }else{
   hero.userData.leftArm.rotation.x=0;
   hero.userData.rightArm.rotation.x=0;
   hero.userData.leftLeg.rotation.x=0;
   hero.userData.rightLeg.rotation.x=0;
   body.position.y=Math.sin(t*2)*.025;
  }

  if(jumping){
   jumpV-=18*dt;
   hero.position.y+=jumpV*dt;
   if(hero.position.y<=0){
    hero.position.y=0;
    jumping=false;
   }
  }

  hero.position.x=THREE.MathUtils.clamp(hero.position.x,-35,35);
  hero.position.z=THREE.MathUtils.clamp(hero.position.z,-75,30);

  const offset=new THREE.Vector3(
   Math.sin(cameraAngle)*8,4.5,Math.cos(cameraAngle)*8
  );
  camera.position.lerp(hero.position.clone().add(offset),.09);
  camera.lookAt(hero.position.x,hero.position.y+2,hero.position.z);

  crystals.forEach(c=>{
   if(c.visible&&c.position.distanceTo(hero.position)<2){
    c.visible=false;
    collected++;
    showMessage('CRYSTAL COLLECTED! '+collected);
   }
  });
 }

 crystals.forEach((c,i)=>{
  c.rotation.y+=dt*.6;
  c.position.y=1+Math.sin(t*2+i)*.15;
 });
 portal.rotation.y+=dt*.35;
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(scene&&renderer){
  update(dt);
  renderer.render(scene,camera);
 }
}
animate();

window.addEventListener('resize',()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
